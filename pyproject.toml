[project]
name = "jiffy-gateway"
version = "0.1.0-rc.2"
description = "Jiffy Autonomous Software Development Company"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "ninja2>=0.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "celery>=5.4",
    "redis>=5.0",
    "requests>=2.34.2",
    "python-dotenv>=1.0",
    "djangorestframework-stubs>=3.17.0",
    "docker>=7.0",
]



[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = "tests.py test_*.py *_tests.py"
addopts = "--tb=short -q"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["config/settings/base.py:__version__"]
changelog_file = "CHANGELOG.md"
build_command = ""
upload_to_pypi = false
upload_to_release = true
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "refactor", "perf", "docs", "chore", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "refactor", "perf"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore", "^ci"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]
