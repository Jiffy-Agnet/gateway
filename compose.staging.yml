services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: jiffy_web
    user: root
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - "${WEB_PORT:-8080}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.base}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      # Both services must point at the same SQLite file (see .env.example).
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/db.sqlite3}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      # Per-provider ingestion secrets, compared against the X-JIFFY-TOKEN
      # request header.  Never share one value across providers.
      GITHUB_INGEST_TOKEN: ${GITHUB_INGEST_TOKEN}
      GITLAB_INGEST_TOKEN: ${GITLAB_INGEST_TOKEN}
      GITEA_INGEST_TOKEN: ${GITEA_INGEST_TOKEN}
      OPEN_API_BASE_URL: ${OPEN_API_BASE_URL}
      OPEN_API_KEY: ${OPEN_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jiffy-internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: jiffy_celery
    # No --concurrency flag: the worker reads CELERY_WORKER_CONCURRENCY from
    # settings so it can be tuned per host from .env.
    command: uv run celery -A config worker -Q execute -l info -n execute@%h
    user: root
    volumes:
      - .:/app
      # Same DB file as the web service — without this the worker migrates its
      # own empty database and every job fails with "Task not found in DB".
      - ./data:/app/data
      - ./opencode.json:/app/opencode.json
    environment:
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.base}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      # Both services must point at the same SQLite file (see .env.example).
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/db.sqlite3}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      # Per-provider ingestion secrets, compared against the X-JIFFY-TOKEN
      # request header.  Never share one value across providers.
      GITHUB_INGEST_TOKEN: ${GITHUB_INGEST_TOKEN}
      GITLAB_INGEST_TOKEN: ${GITLAB_INGEST_TOKEN}
      GITEA_INGEST_TOKEN: ${GITEA_INGEST_TOKEN}
      # Sandbox network egress restriction — forwarded so the worker applies
      # it to each sandbox container it provisions.
      JIFFY_SANDBOX_NETWORK_RESTRICTED: ${JIFFY_SANDBOX_NETWORK_RESTRICTED:-true}
      SANDBOX_NETWORK_ALLOWLIST: ${SANDBOX_NETWORK_ALLOWLIST:-}
      SANDBOX_NETWORK_ALLOWLIST_EXTRA: ${SANDBOX_NETWORK_ALLOWLIST_EXTRA:-}
      # Sandbox resource limits — applied by the worker to each sandbox
      # container it creates through the docker-socket-proxy.
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-jiffy-sandbox:1.2.0}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-2g}
      SANDBOX_MEMORY_SWAP_LIMIT: ${SANDBOX_MEMORY_SWAP_LIMIT:-4g}
      SANDBOX_CPU_LIMIT: ${SANDBOX_CPU_LIMIT:-1.5}
      SANDBOX_NODE_MAX_OLD_SPACE_MB: ${SANDBOX_NODE_MAX_OLD_SPACE_MB:-}
      SANDBOX_PACKAGE_CONCURRENCY: ${SANDBOX_PACKAGE_CONCURRENCY:-2}
      # Wall-clock budget for a single agent run, enforced by the Gateway.
      SANDBOX_AGENT_TIMEOUT: ${SANDBOX_AGENT_TIMEOUT:-3600}
      # Stop+remove the sandbox container after each job; "false" keeps it
      # alive for debugging.
      JIFFY_SANDBOX_CLEANUP: ${JIFFY_SANDBOX_CLEANUP:-true}
      # Task-execution parallelism (each slot can hold one sandbox container).
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      # Forwarded into the sandbox via opencode.json for the coding agent.
      OPEN_API_BASE_URL: ${OPEN_API_BASE_URL}
      OPEN_API_KEY: ${OPEN_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - jiffy-internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy
  # ---------------------------------------------------------------------------
  # Proxies a restricted subset of the Docker Engine API so the Celery worker
  # can manage sandbox containers without having raw host-Docker-root access.
  #
  # Enabled endpoint groups (and why):
  #   CONTAINERS — container create/start/stop/remove (sandbox lifecycle)
  #   IMAGES     — image inspect/get (check if sandbox image exists)
  #   BUILD      — image build from Dockerfile (build sandbox image if missing)
  #   NETWORKS   — network inspect/create (jiffy-sandbox-net for sandbox containers)
  #   EXEC       — exec into running containers (clone repo, run agent)
  #   POST       — global toggle for write operations (required by all of the above)
  #
  # Everything else is disabled (defaults to 0).  The proxy is NOT exposed on
  # any host port — it is only reachable from services on jiffy-internal.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    environment:
      # Container lifecycle (create, start, stop, remove, inspect, list)
      CONTAINERS: 1
      # Image inspect/get (check sandbox image existence)
      IMAGES: 1
      # Build images from Dockerfile (sandbox image build)
      BUILD: 1
      # Network inspect/create (jiffy-sandbox-net)
      NETWORKS: 1
      # Exec into running containers (clone, agent run)
      EXEC: 1
      # Global POST toggle — required for all write operations above
      POST: 1
      # --- Everything below is intentionally disabled ---
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SYSTEM: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      SWARM: 0
    volumes:
      # Only the proxy mounts the real host socket, read-only
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jiffy-internal
    # No ports exposed to the host — internal network only
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.8.0
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 60
    volumes:
      - redis_data:/data
    networks:
      - jiffy-internal
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  jiffy-internal:
    driver: bridge
    internal: false  # containers need outbound access for git clone, pip, npm, etc.
