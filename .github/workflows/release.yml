name: Release

on:
  push:
    branches: [master, develop]

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.check.outputs.released }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.JIFFY_REPO_PAT }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      - name: Ensure CHANGELOG.md exists
        run: touch CHANGELOG.md

      - name: Run semantic release
        env:
          GH_TOKEN: ${{ secrets.JIFFY_REPO_PAT }}
        run: |
          semantic-release version --changelog --push --skip-build

      - name: Post changelog to GitHub Release (final releases only)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.JIFFY_REPO_PAT }}
        run: |
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$NEW_TAG" ]; then
            semantic-release changelog --post-to-release-tag "$NEW_TAG"
          fi

      - name: Check if a release was created
        id: check
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: release
    if: needs.release.outputs.released == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml